<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Glassmorphism: a frosted portal where two far colours meet</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20245a"/><stop offset="1" stop-color="#3b1c5c"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="60"/></clipPath>
    <filter id="soft" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <g filter="url(#soft)">
      <circle cx="70" cy="72" r="62" fill="#ff8f5a"/>
      <circle cx="188" cy="186" r="64" fill="#2fe0cf"/>
    </g>
  </g>
  <circle cx="128" cy="128" r="90" fill="url(#glass)" stroke="#fff" stroke-opacity=".55" stroke-width="4"/>
  <circle cx="128" cy="128" r="52" fill="#1a1d48" fill-opacity=".55" stroke="#fff" stroke-width="14"/>
  <circle cx="113" cy="128" r="16" fill="#ffb07f"/>
  <circle cx="143" cy="128" r="16" fill="#6ff5e6"/>
</svg>
